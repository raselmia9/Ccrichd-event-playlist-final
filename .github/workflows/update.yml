name: Update Live Event JSON

on:
  schedule:
    - cron: '*/30 * * * *'  # প্রতি ৩০ মিনিট পর পর রান হবে
  workflow_dispatch:        # ম্যানুয়ালি রান করার অপশন

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: Run main script
        run: python main.py

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "actions-user"
          git config --global user.email "actions@github.com"
          git add "Live Event.json"
          git commit -m "Auto-update Live Event.json via GitHub Actions [skip ci]" || exit 0
          git push
