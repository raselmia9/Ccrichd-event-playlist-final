name: Auto Update M3U8 Playlist

on:
  schedule:
    - cron: '*/30 * * * *'  # প্রতি ৩০ মিনিট পরপর রান হবে
  workflow_dispatch:        # ম্যানুয়ালি রান করার অপশন

permissions:
  contents: write  # গিটহাবে ফাইল কমিট ও পুশ করার অনুমতি দেওয়ার জন্য

jobs:
  update-link:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright

      - name: Install Playwright Browser
        run: |
          playwright install chromium

      - name: Run script to generate M3U playlist
        run: python main.py

      - name: Commit and push if playlist changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update playlist.m3u [skip ci]" && git push)
